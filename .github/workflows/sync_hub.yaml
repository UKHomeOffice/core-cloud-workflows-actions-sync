name: Reusable workflow for GHES sync.

on:
  workflow_call:
    inputs:
      ghes-instance-url:
        description: 'The GHES instance URL e.g. https://github.<GHES-HOSTNAME>'
        required: true
        type: string
      ghes-owner:
        description: 'The organisation within the GHES instance that you want your repo synced to'
        required: true
        type: string
      environment:
        required: true
        type: string
    secrets:
      APP_ID:
        required: true
      PRIVATE_KEY:
        required: true

jobs:
  sync-to-ghes:
    runs-on: cc-ghec-actions-runner
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse GHES Host
        id: parse-host
        run: |
          hostname=$(echo "${{ inputs.ghes-instance-url }}" | sed -E 's#^https?://([^/]+)/?#\1#')
          echo $hostname
          echo "hostname=$hostname" >> $GITHUB_OUTPUT

      - name: Generate GitHub App Token for GHES
        id: get_ghes_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
          github-api-url: 'https://${{ steps.parse-host.outputs.hostname }}/api/v3'
          owner: ${{ inputs.ghes-owner }}

      - name: Create GHES repo if it doesn't exist
        id: create_repos
        env:
          GHES_TOKEN: ${{ steps.get_ghes_token.outputs.token }}
          GHES_HOST: ${{ steps.parse-host.outputs.hostname }}
          REPO: ${{ github.event.repository.name }}
          GHES_OWNER: ${{ inputs.ghes-owner }}
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GHES_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://$GHES_HOST/api/v3/repos/$GHES_OWNER/$REPO)
          echo $HTTP_STATUS
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "Success: Repository '$GHES_OWNER/$REPO' exists."
          else
            curl -L \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GHES_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://${GHES_HOST}/api/v3/orgs/${GHES_OWNER}/repos \
              -d "{\"name\":\"${REPO}\",\"description\":\"A reusable workflow of ${REPO} synced from the repo stored in github.com\",\"visibility\":\"public\",\"has_projects\":false,\"has_issues\":false,\"homepage\":\"https://github.com/${GHES_OWNER}/${REPO}\"}"
          fi

      - name: Set up GHES remote and push
        env:
          GHES_TOKEN: ${{ steps.get_ghes_token.outputs.token }}
          GHES_HOST: ${{ steps.parse-host.outputs.hostname }}
          REPO: ${{ github.event.repository.name }}
          GHES_OWNER: ${{ inputs.ghes-owner }}
        run: |
          git config --global user.name "GitHub Actions Sync"
          git config --global user.email "actions-sync@homeoffice.gov.uk"
          git remote add ghes "https://x-access-token:${GHES_TOKEN}@${GHES_HOST}/${GHES_OWNER}/${REPO}.git" 
          git remote -v
          echo "Pushing to GHES..."

          git push ghes --all --force
          git push ghes --tags --force
          
          echo "Sync complete."
