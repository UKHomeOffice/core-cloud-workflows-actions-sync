name: Reusable workflow for GHES sync.

on:
  workflow_call:
    inputs:
      ghes-instances:
        description: 'A multi-line list of GHES instances to sync this workflow with'
        required: true
        type: string
    secrets:
      APP_ID:
        required: true
      PRIVATE_KEY:
        required: true

jobs:
  generate-matrix:
    runs-on: cc-ghec-actions-runner 
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Generate matrix from the ghes-instances input
        id: set-matrix
        env:
          INSTANCES: ${{ inputs.ghes-instances }}
        run: |
          matrix_json=$(jq -cn --arg instances "$INSTANCES" '
            [
              ($instances | split("\n")) as $i |
              range($i | length) |
              # Only process non-empty lines
              select($i[.] != "") |
              {
                "url": $i[.],
              }
            ]
          ')
          echo "matrix=${matrix_json}" >> $GITHUB_OUTPUT

      - name: Generate JWT and Fetch Installation Token
        id: get-token
        env:
          APP_ID: ${{ secrets.GHES_APP_ID }}
          PRIVATE_KEY: ${{ secrets.GHES_PRIVATE_KEY }}
          ANCHOR_REPO: "th-test-page"
        run: |
          echo "Step 1: Generating JWT..."

          echo "${PRIVATE_KEY}" > private-key.pem

          now=$(date +%s)
          exp=$((now + 600)) # Expiration is 10 minutes (600 seconds)

          header_json='{"alg":"RS256","typ":"JWT"}'
          payload_json=$(printf '{"iat":%s,"exp":%s,"iss":%s}' "$now" "$exp" "$APP_ID")

          header_b64=$(echo -n "${header_json}" | base64 | tr -d '=' | tr '/+' '_-')
          payload_b64=$(echo -n "${payload_json}" | base64 | tr -d '=' | tr '/+' '_-')

          signature=$(printf "%s.%s" "${header_b64}" "${payload_b64}" | openssl dgst -sha256 -sign private-key.pem | base64 | tr -d '=' | tr '/+' '_-')

          JWT="${header_b64}.${payload_b64}.${signature}"
          echo "JWT generated successfully."

          echo "-------------------------------------"
          echo "Step 2: Fetching Installation ID..."

          INSTALLATION_RESPONSE=$(curl --silent --fail-with-body -X GET \
            -H "Authorization: Bearer ${JWT}" \
            -H "Accept: application/vnd.github.v3+json" \
            "${GHES_URL}/api/v3/repos/${OWNER}/${ANCHOR_REPO}/installation")

          INSTALLATION_ID=$(echo "${INSTALLATION_RESPONSE}" | jq -r '.id')

          if [[ -z "${INSTALLATION_ID}" || "${INSTALLATION_ID}" == "null" ]]; then
            echo "Error: Could not fetch a valid Installation ID."
            echo "Response was: ${INSTALLATION_RESPONSE}"
            exit 1
          fi
          echo "Installation ID fetched: ${INSTALLATION_ID}"

          echo "-------------------------------------"
          echo "Step 3: Fetching the final Installation Access Token..."

          TOKEN_RESPONSE=$(curl --silent --fail-with-body -X POST \
            -H "Authorization: Bearer ${JWT}" \
            -H "Accept: application/vnd.github.v3+json" \
            "${GHES_URL}/api/v3/app/installations/${INSTALLATION_ID}/access_tokens")

          INSTALLATION_TOKEN=$(echo "${TOKEN_RESPONSE}" | jq -r '.token')

          if [[ -z "${INSTALLATION_TOKEN}" || "${INSTALLATION_TOKEN}" == "null" ]]; then
            echo "Error: Could not fetch a valid Installation Token."
            echo "Response was: ${TOKEN_RESPONSE}"
            exit 1
          fi
          echo "Installation Token fetched successfully."

          echo "-------------------------------------"
          echo "Step 4: Setting token as a masked output."
          echo "::add-mask::${INSTALLATION_TOKEN}"
          echo "token=${INSTALLATION_TOKEN}" >> $GITHUB_OUTPUT

  sync-to-ghes:
    needs: generate-matrix
    runs-on: cc-ghec-actions-runner
    strategy:
      max-parallel: 1
      matrix:
        instance: ${{ fromJSON(needs.generate-matrix.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Parse GHES Host
        id: parse-host
        run: |
          hostname=$(echo "${{ matrix.instance.url }}" | sed -E 's#^https?://([^/]+)/?#\1#')
          echo "hostname=$hostname" >> $GITHUB_OUTPUT

      - name: Generate GitHub App Token for GHES
        id: get_ghes_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
          github-api-url: 'https://${{ steps.parse-host.outputs.hostname }}'
          repositories: 'th-test-page'
          owner: 'home-office-sandbox'

      - name: Create GHES repo if it doesn't exist
        env:
          GH_TOKEN: ${{ steps.get_ghes_token.outputs.token }}
          GH_HOST: ${{ steps.parse-host.outputs.hostname }}
          REPO_PATH: ${{ github.repository }}
        run: |
          # We check if the repo exists. The `gh repo view` command will fail (exit with a non-zero status) if it doesn't.
          if ! gh repo view "${REPO_PATH}"; then
            echo "Repository ${{ env.REPO_PATH }} does not exist on ${{ env.GH_HOST }}. Creating it now..."
            gh repo create "${REPO_PATH}" --public
            echo "Repository created successfully."
          else
            echo "Repository ${{ env.REPO_PATH }} already exists on ${{ env.GH_HOST }}."
          fi

      - name: Set up GHES remote and push
        env:
          GHES_TOKEN: ${{ steps.get_ghes_token.outputs.token }}
          GHES_HOST: ${{ steps.parse-host.outputs.hostname }}
          REPO_PATH: ${{ github.repository }}
        run: |
          git config --global user.name "GitHub Actions Sync"
          git config --global user.email "actions-sync@homeoffice.gov.uk"
          
          full_ghes_url="${GHES_HOST}/${REPO_PATH}.git"
          echo "Constructed full GHES URL: ${full_ghes_url}"

          git remote add ghes "https://x-access-token:${GHES_TOKEN}@${full_ghes_url#https://}"
          
          echo "GHES remote added for ${full_ghes_url}"
          echo "Pushing to GHES..."

          git push --all ghes --force
          git push --tags ghes --force
          
          echo "Sync to ${full_ghes_url} complete."
