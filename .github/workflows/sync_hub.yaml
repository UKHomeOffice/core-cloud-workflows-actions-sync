name: Reusable workflow for GHES sync.

on:
  workflow_call:
    inputs:
      ghes-instances:
        description: 'A multi-line list of GHES instances to sync the repositories with'
        required: true
        type: string
      ghes-owners:
        description: 'A multi-line list of the GHES organisations where the repos are going. One per GHES instance.'
        required: true
        type: string
    secrets:
      APP_ID:
        required: true
      PRIVATE_KEY:
        required: true

jobs:
  generate-matrix:
    runs-on: cc-ghec-actions-runner 
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Generate matrix from instances and owners
        id: set-matrix
        env:
          INSTANCES: ${{ inputs.ghes-instances }}
          OWNERS: ${{ inputs.ghes-owners }}
        run: |
          matrix_json=$(jq -cn --arg instances "$INSTANCES" --arg owners "$OWNERS" '
            [
              ($instances | split("\n")) as $i |
              ($owners | split("\n")) as $o |
              range($i | length) |
              select($i[.] != "") |
              {
                "url": $i[.],
                "owner": $o[.]
              }
            ]
          ')
          echo "matrix=${matrix_json}" >> $GITHUB_OUTPUT

  sync-to-ghes:
    needs: generate-matrix
    runs-on: cc-ghec-actions-runner
    strategy:
      max-parallel: 1
      matrix:
        instance: ${{ fromJSON(needs.generate-matrix.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Debug
        id: debug
        run: |
          env

      - name: Parse GHES Host
        id: parse-host
        run: |
          hostname=$(echo "${{ matrix.instance.url }}" | sed -E 's#^https?://([^/]+)/?#\1#')
          echo $hostname
          echo "hostname=$hostname" >> $GITHUB_OUTPUT
          owners=$(echo "${{ matrix.instance.owner }}")
          echo $owners
          echo "owners=$owners" >> $GITHUB_OUTPUT

      - name: Generate GitHub App Token for GHES
        id: get_ghes_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
          github-api-url: 'https://${{ steps.parse-host.outputs.hostname }}/api/v3'
          owner: ${{ steps.parse-host.outputs.owners }}

      - name: Create GHES repo if it doesn't exist
        id: create_repos
        env:
          GHES_TOKEN: ${{ steps.get_ghes_token.outputs.token }}
          GHES_HOST: ${{ steps.parse-host.outputs.hostname }}
          REPO: ${{ github.event.repository.name }}
          GHES_OWNER: ${{ steps.parse-host.outputs.owners }}
        run: |
          curl -v -w "%{http_code}" \
            -X GET \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GHES_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://${{ steps.parse-host.outputs.hostname }}/api/v3/repos/$GHES_OWNER/$REPO
          echo $HTTP_STATUS
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GHES_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://${GHES_HOST}/api/v3/orgs/${GHES_OWNER}/repos \
            -d "{\"name\":\"${REPO}\",\"description\":\"A reusable workflow of ${REPO} synced from the HO github.com\",\"visibility\":\"public\",\"has_projects\":false,\"has_issues\":false,\"homepage\":\"https://github.com/${GHES_OWNER}/${REPO}\"}"

      - name: Set up GHES remote and push
        env:
          GHES_TOKEN: ${{ steps.get_ghes_token.outputs.token }}
          GHES_HOST: ${{ steps.parse-host.outputs.hostname }}
          REPO: ${{ github.event.repository.name }}
          GHES_OWNER: ${{ steps.parse-host.outputs.owners }}
        run: |
          git config --global user.name "GitHub Actions Sync"
          git config --global user.email "actions-sync@homeoffice.gov.uk"
          git remote add ghes "https://x-access-token:${GHES_TOKEN}@${GHES_HOST}/${GHES_OWNER}/${REPO}.git" 
          git remote -v
          echo "Pushing to GHES..."

          git push ghes --all --force
          git push ghes --tags --force
          
          echo "Sync to ${full_ghes_url} complete."
